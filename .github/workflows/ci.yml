name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'sources/**'
      - 'archive/**'
      - 'logos/**'
      - 'manifest.json'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: TerraScale/.github/.github/workflows/command.yml@3a54c0184eacdc45466c1123bca67a99db62e91c
    with:
      command: |
        python3 scripts/check_resources.py
